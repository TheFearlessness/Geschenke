:root{
  --cw:min(66vw,320px);
  --sw:min(82vw,340px);
  --ph:min(64vh,500px);
}
@supports (height:1dvh){:root{--ph:min(64dvh,500px)}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}
body{background:#0c0705;font-family:'IM Fell English',Georgia,serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}

.scene{position:fixed;inset:0;overflow:hidden;opacity:0;transition:opacity 2.2s ease}
.scene.lit{opacity:1}
.room{position:absolute;inset:0;background:radial-gradient(circle at 30% 55%,#4a2e18 0%,#24150b 40%,#0c0705 80%)}

/* Kerze */
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:fl 1.3s infinite}
@keyframes fl{0%,100%{transform:scale(1,1) skewX(0)}20%{transform:scale(.94,1.09) skewX(3deg)}40%{transform:scale(1.04,.93) skewX(-3deg)}60%{transform:scale(.97,1.06) skewX(1deg)}80%{transform:scale(1.02,.97) skewX(-2deg)}}
.halo{animation:halo 2.1s ease-in-out infinite}
@keyframes halo{50%{opacity:.6}}
.light{position:absolute;inset:0;z-index:6;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(circle at var(--lx,15%) var(--ly,55%),rgba(255,175,85,.36),rgba(255,130,50,.12) 28%,transparent 58%)}
.vignette{position:absolute;inset:0;z-index:7;pointer-events:none;background:radial-gradient(ellipse at 50% 62%,transparent 35%,rgba(0,0,0,.85) 100%)}

/* Schatulle (echter 3D-Körper) */
.stage{position:absolute;inset:0;perspective:1000px;perspective-origin:50% 36%;overflow:hidden}
.chestWrap,.roomWorld,.fgWorld{position:absolute;left:58%;top:76%;width:0;height:0;transform-style:preserve-3d;
  transform:rotateX(-6deg) rotateY(26deg);z-index:5}
.wall3d{position:absolute;left:-1300px;top:-1500px;width:2600px;height:1500px;
  background:radial-gradient(ellipse 22% 30% at 46% 92%,rgba(255,160,80,.14),transparent 70%),linear-gradient(rgba(0,0,0,.95),rgba(0,0,0,.72) 70%,rgba(0,0,0,.8)),var(--tx-stone) center/440px auto repeat}
.table3d{position:absolute;-webkit-backface-visibility:hidden;backface-visibility:hidden;
  background:radial-gradient(ellipse 30% 30% at 50% 50%,rgba(255,170,90,.12),transparent 70%),
    radial-gradient(ellipse 34% 40% at 48% 52%,rgba(0,0,0,.25) 10%,rgba(0,0,0,.92) 100%),var(--tx-wood_table) center/900px auto repeat}
.tableEdge{position:absolute;height:40px;background:linear-gradient(rgba(255,190,120,.12),rgba(0,0,0,.6)),var(--tx-wood_table) center/900px auto}
.candle{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d;transform:translate3d(var(--cx),0,var(--cz))}
.cs{position:absolute;-webkit-backface-visibility:hidden;backface-visibility:hidden;
  background:linear-gradient(rgba(255,168,80,.5),rgba(255,168,80,0) 34px),var(--sh),linear-gradient(#efe2c4,#ead9b6),var(--tx-wax) center/30px 60px;background-blend-mode:normal,normal,multiply,normal}
.cs.in{background:linear-gradient(rgba(120,80,30,.35),rgba(80,50,20,.5)),#e7d3a8}
.drip{position:absolute;top:-1px;border-radius:0 0 50% 50% / 0 0 35% 35%;
  background:linear-gradient(90deg,rgba(255,250,235,.55),rgba(255,250,235,0) 60%),linear-gradient(#efe0bf,#e5d2aa)}
.ctop{position:absolute;border-radius:50%;background:radial-gradient(circle at 50% 50%,#ffe9b0,#f0d79f 35%,#d8bd85 75%,#b99c66)}
.cpool{position:absolute;border-radius:47% 53% 44% 56% / 52% 46% 54% 48%;background:radial-gradient(ellipse at 45% 45%,rgba(226,206,164,.95),rgba(196,170,122,.85) 65%,rgba(170,140,95,.6))}
.bb{position:absolute;transform-origin:50% 100%;transform:translate3d(0,var(--fy),0) rotateY(-26deg) rotateX(6deg)}
.scene.camup .bb{transform:translate3d(0,var(--fy),0) rotateY(-12deg) rotateX(58deg)}
.bb svg{display:block;overflow:visible}
.chest3d{left:calc(var(--W) / -2);top:calc(var(--H) * -1);width:var(--W);height:var(--H)}
.floorShadow{position:absolute;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.8),rgba(0,0,0,.4) 45%,transparent 70%)}
.glowPlane{position:absolute;pointer-events:none;opacity:0;transition:opacity 1.8s ease .4s;
  background:radial-gradient(ellipse 50% 50% at 50% 55%,rgba(255,190,110,.35),rgba(255,150,70,.1) 60%,transparent 80%)}
.chestWrap.opened .glowPlane{opacity:1}
.chest3d{position:absolute;transform-style:preserve-3d}
.f{position:absolute;left:0;top:0;width:var(--W);height:var(--H);-webkit-backface-visibility:hidden;backface-visibility:hidden}
.f.side{width:var(--D);left:calc((var(--W) - var(--D)) / 2)}
.f.flat{height:var(--D);top:calc((var(--H) - var(--D)) / 2)}
.f.rimx{height:var(--t);top:calc((var(--H) - var(--t)) / 2)}
.f.rimz{width:var(--t);left:calc((var(--W) - var(--t)) / 2);height:var(--D);top:calc((var(--H) - var(--D)) / 2)}
.wood{background:
  repeating-linear-gradient(180deg,transparent 0,transparent calc(var(--H) / 3 - 2px),rgba(10,4,0,.75) calc(var(--H) / 3 - 2px),rgba(10,4,0,.75) calc(var(--H) / 3)),
  var(--shade,linear-gradient(transparent,transparent)),var(--tx-wood_chest) 30% 60%/auto 260%}
.o-front{transform:translateZ(calc(var(--D) / 2));--shade:linear-gradient(rgba(255,200,140,.06),rgba(0,0,0,.08) 50%,rgba(0,0,0,.5))}
.o-back{transform:translateZ(calc(var(--D) / -2)) rotateY(180deg);--shade:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.75))}
.o-left{transform:translateX(calc(var(--W) / -2)) rotateY(-90deg);--shade:linear-gradient(90deg,rgba(0,0,0,.25),rgba(255,185,110,.16) 70%,rgba(255,200,140,.1)),linear-gradient(rgba(0,0,0,0) 40%,rgba(0,0,0,.45))}
.o-right{transform:translateX(calc(var(--W) / 2)) rotateY(90deg);--shade:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.8))}
.o-bottom{transform:translateY(calc(var(--H) / 2)) rotateX(-90deg);background:#120802}
.velvet{background:var(--vshade,linear-gradient(transparent,transparent)),var(--tx-velvet) center/120px auto}
.i-front{transform:translateZ(calc(var(--D) / 2 - var(--t))) rotateY(180deg);--vshade:linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.25) 45%,rgba(0,0,0,.45))}
.i-back{transform:translateZ(calc(var(--D) / -2 + var(--t)));--vshade:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.1) 40%,rgba(0,0,0,.4))}
.i-left{transform:translateX(calc(var(--W) / -2 + var(--t))) rotateY(90deg);--vshade:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.3) 50%,rgba(0,0,0,.5))}
.i-right{transform:translateX(calc(var(--W) / 2 - var(--t))) rotateY(-90deg);--vshade:linear-gradient(rgba(0,0,0,.3),rgba(255,170,100,.05) 50%,rgba(0,0,0,.4))}

  --vshade:radial-gradient(ellipse at 50% 45%,rgba(255,170,110,.18),rgba(0,0,0,0) 55%,rgba(0,0,0,.55))}

/* Eisenecken + Messingbänder */

  background:radial-gradient(circle at 50% 12%,#9a948a 0 1.6px,#2a2622 2.6px,transparent 3.4px),radial-gradient(circle at 50% 50%,#9a948a 0 1.6px,#2a2622 2.6px,transparent 3.4px),
    radial-gradient(circle at 50% 88%,#9a948a 0 1.6px,#2a2622 2.6px,transparent 3.4px),
    linear-gradient(90deg,#1a1715,#4a443e 40%,#2a2622 70%,#141210);box-shadow:0 0 3px rgba(0,0,0,.8)}

.band{position:absolute;top:0;bottom:0;width:6%;

    linear-gradient(90deg,rgba(35,20,0,.65),rgba(255,236,180,.3) 42%,rgba(35,20,0,.5)),var(--tx-brass) center/auto 100%;box-shadow:1px 0 2px rgba(0,0,0,.6),-1px 0 2px rgba(0,0,0,.6)}

  background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,0) 18%,rgba(0,0,0,0) 82%,rgba(0,0,0,.45)),var(--tx-wood_chest) center/auto 900%}

  padding:22px 34px;text-align:center;color:#3a250f}

  background:radial-gradient(circle at 40% 35%,#d0473c,#8e1d17 60%,#5e0f0c);box-shadow:0 2px 4px rgba(0,0,0,.4),inset 0 0 0 4px rgba(0,0,0,.15);
  display:grid;place-items:center;font-family:'Cinzel',serif;font-weight:700;color:rgba(255,200,180,.55);font-size:16px}

.spk{position:fixed;width:5px;height:5px;border-radius:50%;z-index:40;pointer-events:none;opacity:0;animation:spk 1.9s ease-out forwards}
@keyframes spk{0%{opacity:0;transform:translate(0,0) scale(.4)}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1)}}

  background:rgba(255,255,255,.12);color:#e8d29c;font-size:20px;z-index:50;opacity:0;pointer-events:none;transition:opacity 1s}

<script>
/* =========================================================
   HIER KANNST DU ALLES ANPASSEN
   code:   Tag + Monat des Geburtstags, 4 Ziffern (z. B. 24. Mai = "2405")
   gravur: kleiner Hinweis auf dem Deckel (leer lassen = keine Gravur)
   ========================================================= */
const CONFIG = {
  code:   "0411",
  gravur: "TT · MM",
  kicker: "Gutschein",
  titel:  "für ein gemeinsames Abenteuer",
  text:   "Wer diese Truhe öffnet, hat bewiesen, dass sie Rätsel lösen kann. Die nächste Prüfung wartet: ein Escape Room deiner Wahl. Wir haben 60 Minuten, um rauszukommen.",
  gruss:  "Alles Liebe zum Geburtstag, mein Schatz!",
  von:    ""
};
/* ========================================================= */

const $ = s => document.querySelector(s);
const CODE = String(CONFIG.code).replace(/\D/g,'').padStart(4,'0').slice(0,4);
$('#tK').textContent = CONFIG.kicker;
$('#tT').textContent = CONFIG.titel;
$('#tX').textContent = CONFIG.text;
$('#tG').textContent = CONFIG.gruss;
$('#tV').textContent = CONFIG.von;
if(!CONFIG.von) $('#tV').style.display = 'none';
$('#seal').textContent = CONFIG.von ? CONFIG.von.trim().split(/\s+/).pop().charAt(0).toUpperCase() : '';

const scene = $('#scene'), veil = $('#veil'), scroll = $('#scroll'), plate = $('#plate');
const paper = $('#paper'), inner = $('#paperInner');
let state = 'intro';

/* ---------- Klänge: alles live im Browser erzeugt (startet mit der ersten Berührung) ---------- */
let ac = null, out = null, wet = null;
const bufCache = {};
function audio(){
  if(!ac){
    try{
      ac = new (window.AudioContext || window.webkitAudioContext)();
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -16; comp.ratio.value = 3; comp.attack.value = .004; comp.release.value = .2;
      comp.connect(ac.destination);
      out = ac.createGain(); out.gain.value = .9; out.connect(comp);
      const conv = ac.createConvolver(); conv.buffer = impulse(REVERB.time, REVERB.decay);
      wet = ac.createGain(); wet.gain.value = REVERB.mix; wet.connect(conv); conv.connect(comp);
    }catch(e){ ac = null; }
  }
  if(ac && ac.state === 'suspended') ac.resume();
  return ac;
}
function impulse(sec, decay){
  const n = Math.floor(ac.sampleRate*sec), b = ac.createBuffer(2, n, ac.sampleRate);
  for(let c=0;c<2;c++){ const d = b.getChannelData(c); for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/n, decay); }
  return b;
}
function noiseBuf(kind){
  if(bufCache[kind]) return bufCache[kind];
  const n = ac.sampleRate*4, b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
  let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0,last=0;
  for(let i=0;i<n;i++){
    const w = Math.random()*2-1;
    if(kind === 'white') d[i] = w;
    else if(kind === 'pink'){
      b0=.99886*b0+w*.0555179; b1=.99332*b1+w*.0750759; b2=.969*b2+w*.153852;
      b3=.8665*b3+w*.3104856; b4=.55*b4+w*.5329522; b5=-.7616*b5-w*.016898;
      d[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11; b6=w*.115926;
    } else { last = (last + .02*w)/1.02; d[i] = last*3.5; }
  }
  return bufCache[kind] = b;
}
function send(node, amount){
  if(!amount) return;
  const s = ac.createGain(); s.gain.value = amount; node.connect(s); s.connect(wet);
}
/* gefiltertes Rauschen als kurzer Impuls */
function burst(o){
  const a = audio(); if(!a) return;
  const {kind='white', dur=.05, f=1000, q=1, type='bandpass', gain=.5, at=0, attack=.002, rev=.2} = o;
  const t = a.currentTime + at;
  const s = a.createBufferSource(); s.buffer = noiseBuf(kind);
  const fl = a.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
  const g = a.createGain();
  g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(gain, t+attack);
  g.gain.exponentialRampToValueAtTime(.0001, t+attack+dur);
  s.connect(fl); fl.connect(g); g.connect(out); send(g, rev);
  s.start(t, Math.random()*3); s.stop(t+attack+dur+.05);
}
/* abklingender Teilton (für Glas, Metall, Holzkörper) */
function partial(freq, dur, gain, at=0, rev=.3){
  const a = audio(); if(!a) return;
  const t = a.currentTime + at;
  const o = a.createOscillator(); o.frequency.value = freq * (1 + (Math.random()-.5)*.006);
  const g = a.createGain();
  g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(gain, t+.002);
  g.gain.exponentialRampToValueAtTime(.0001, t+dur);
  o.connect(g); g.connect(out); send(g, rev);
  o.start(t); o.stop(t+dur+.05);
}

/* ---- Papier / Pergament ---- */
function crinkle(at, v){
  burst({dur:.003+Math.random()*.012, f:1400+Math.random()*5500, q:1.2+Math.random()*4,
         gain:.2*v, at, attack:.0005, rev:.12});
}
function paperSlide(dur=.9, at=0){
  burst({kind:'pink', dur, f:2300, q:.6, gain:.13, at, attack:dur*.45, rev:.15});
  for(let i=0;i<12;i++) crinkle(at + Math.random()*dur, .35 + Math.random()*.3);
}
let rsSrc = null, rsGain = null, rsBP = null;
function rustleStart(){
  const a = audio(); if(!a) return;
  rsSrc = a.createBufferSource(); rsSrc.buffer = noiseBuf('white'); rsSrc.loop = true;
  const hp = a.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 900;
  rsBP = a.createBiquadFilter(); rsBP.type = 'bandpass'; rsBP.frequency.value = 2600; rsBP.Q.value = .7;
  rsGain = a.createGain(); rsGain.gain.value = 0;
  rsSrc.connect(hp); hp.connect(rsBP); rsBP.connect(rsGain); rsGain.connect(out); send(rsGain, .12);
  rsSrc.start(0, Math.random()*3);
}
function rustleMove(speed){            // speed in px/ms
  if(!rsGain) return;
  const t = ac.currentTime;
  rsGain.gain.setTargetAtTime(Math.min(.2, speed*.16), t, .04);
  rsBP.frequency.setTargetAtTime(1900 + Math.random()*2600, t, .05);
  if(Math.random() < Math.min(1, speed*1.4)){
    const n = Math.min(4, 1 + Math.floor(speed*2));
    for(let i=0;i<n;i++) crinkle(Math.random()*.03, .5 + Math.random()*.5);
  }
}
function rustleStop(){
  if(!rsGain) return;
  rsGain.gain.setTargetAtTime(0, ac.currentTime, .06);
  const s = rsSrc; setTimeout(() => { try{ s.stop(); }catch(e){} }, 600);
  rsGain = null;
}
function unfurl(){                     // Rolle springt ganz auf + "Flapp"
  for(let i=0;i<18;i++) crinkle(i*.022 + Math.random()*.02, 1 - i/22);
  burst({kind:'pink', dur:.14, f:850, q:.6, gain:.38, at:.42, attack:.004, rev:.25});
  burst({dur:.05, f:2600, q:.9, gain:.22, at:.42, attack:.002, rev:.2});
  partial(105, .09, .14, .42, .1);
}

const REVERB = {time: 1.3, decay: 3, mix: .28};   // kleiner Steinraum

/* ---- Raumklang: leises Grundrauschen + knisternde Kerze ---- */
let ambOn = false;
function startAmbience(){
  const a = audio(); if(!a || ambOn) return; ambOn = true;
  const s = a.createBufferSource(); s.buffer = noiseBuf('brown'); s.loop = true;
  const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 170;
  const g = a.createGain(); g.gain.setValueAtTime(0, a.currentTime); g.gain.linearRampToValueAtTime(.16, a.currentTime + 3);
  s.connect(lp); lp.connect(g); g.connect(out); s.start(0, Math.random()*3);
  const f = a.createBufferSource(); f.buffer = noiseBuf('pink'); f.loop = true;      // Flamme
  const fb = a.createBiquadFilter(); fb.type = 'bandpass'; fb.frequency.value = 500; fb.Q.value = .6;

                                gain:.04 + Math.random()*.07, at:i*.03*Math.random(), attack:.0005, rev:.3});

/* ---- Deckel knarrt (Haft-Gleit-Reibung im Scharnier) ---- */
function creak(dur=1.35){
  const a = audio(); if(!a) return;
  const t = a.currentTime, N = 64;
  const o = a.createOscillator(); o.type = 'sawtooth';
  const fc = new Float32Array(N); let f = 70;
  for(let i=0;i<N;i++){ f += (Math.random()-.45)*14; f = Math.max(38, Math.min(160, f)); fc[i] = f; }
  o.frequency.setValueCurveAtTime(fc, t, dur);
  const am = a.createGain(); const ac2 = new Float32Array(N);
  for(let i=0;i<N;i++){ const p = i/(N-1); ac2[i] = Math.pow(Math.sin(p*Math.PI), .6) * (.5 + .5*Math.random()); }
  am.gain.setValueCurveAtTime(ac2, t, dur);
  const g = a.createGain(); g.gain.value = .3;
  o.connect(am);
  [[650,4],[1550,6],[2900,8]].forEach(([fr, q]) => {
    const b = a.createBiquadFilter(); b.type = 'bandpass'; b.frequency.value = fr; b.Q.value = q;
    am.connect(b); b.connect(g);
  });
  g.connect(out); send(g, .5);
  o.start(t); o.stop(t + dur + .05);
}

/* ---------- Kerze in 3D: Zylinder aus Wachsstreifen, abgeschmolzener Rand, Läufer, Pfütze ---------- */
function buildCandle3D(el, id, r, h, seed, flDur, flDelay){
  let st = seed*9301 + 49297; const rnd = () => (st = (st*9301 + 49297) % 233280) / 233280;
  const N = 16, sw = 2*r*Math.tan(Math.PI/N) + .6;
  const dip = 4 + rnd()*7, meltDir = rnd()*Math.PI*2;          // eine Seite tiefer abgebrannt
  const Ld = [-.5, .85];                                          // Licht von vorne links
  const lowTop = h - dip;
  let html = '';
  // Pfütze auf dem Tisch
  const pr = r*1.45;
  html += `<div class="cpool" style="width:${pr*2}px;height:${pr*1.7}px;left:${-pr}px;top:${-pr*.85}px;transform:translateY(-.5px) rotateX(90deg) rotateZ(${rnd()*360}deg)"></div>`;
  const dripAt = new Set(); const nd = 3 + Math.floor(rnd()*3); while(dripAt.size < nd) dripAt.add(Math.floor(rnd()*N));
  for(let j=0;j<N;j++){
    const a = j*2*Math.PI/N;
    const hj = h - dip*(.5 + .5*Math.cos(a - meltDir)) + (rnd()-.5)*1.6;   // ungleichmäßiger Rand
    const lum = ang => .42 + .58*Math.max(0, Math.sin(ang)*Ld[0] + Math.cos(ang)*Ld[1]) + .12*Math.pow(Math.max(0, Math.sin(ang)*Ld[0] + Math.cos(ang)*Ld[1]), 8);
    const da = Math.PI/N, bl = lum(a - da), br = lum(a + da);
    const sh = `linear-gradient(90deg,rgba(40,22,5,${Math.max(0,(1-bl)*.8).toFixed(3)}),rgba(40,22,5,${Math.max(0,(1-br)*.8).toFixed(3)}))`;
    let inner = '';
    if(dripAt.has(j)){
      const dw = sw*(.55 + rnd()*.35), dl = h*(.15 + rnd()*.45);
      inner = `<div class="drip" style="left:${(sw-dw)/2}px;width:${dw}px;height:${dl}px"></div>`;
    }
    const tf = `rotateY(${a*180/Math.PI}deg) translateZ(${r}px)`;
    html += `<div class="cs" style="--sh:${sh};width:${sw}px;height:${hj}px;left:${-sw/2}px;top:${-hj}px;transform:${tf}">${inner}</div>`;
    // Innenwand des Kraters (sichtbar von oben)
    const ih = hj - lowTop + 1;
    if(ih > 1) html += `<div class="cs in" style="width:${sw}px;height:${ih}px;left:${-sw/2}px;top:${-hj}px;transform:rotateY(${a*180/Math.PI + 180}deg) translateZ(${-r+.8}px)"></div>`;
  }
  // Oberseite: Wachssee
  html += `<div class="ctop" style="width:${r*2}px;height:${r*2}px;left:${-r}px;top:${-r}px;transform:translateY(${-lowTop+1}px) rotateX(90deg)"></div>`;
  // Flamme (dreht sich zur Kamera)
  const fw = 30, fh = 56;
  html += `<div class="bb" style="--fy:${-lowTop+1}px;width:${fw}px;height:${fh}px;left:${-fw/2}px;top:${-fh}px">
    <svg width="${fw}" height="${fh}" viewBox="0 0 30 56" aria-hidden="true">
      <defs>
        <radialGradient id="f3${id}" cx="50%" cy="72%" r="62%"><stop offset="0" stop-color="#fffdf0"/><stop offset=".3" stop-color="#ffe78a"/><stop offset=".65" stop-color="#ff9a2e"/><stop offset="1" stop-color="#ff5a00" stop-opacity="0"/></radialGradient>
        <radialGradient id="h3${id}"><stop offset="0" stop-color="#ffc070" stop-opacity=".5"/><stop offset="1" stop-color="#ff8a30" stop-opacity="0"/></radialGradient>
      </defs>
      <circle class="halo" cx="15" cy="26" r="24" fill="url(#h3${id})"/>
      <path d="M15,56 Q16.5,52 15.6,47" stroke="#1a0f06" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <path class="flame" style="animation-duration:${flDur};animation-delay:${flDelay}" d="M15.6,20 C22,32 22.5,41 15.6,48 C8.7,41 9.2,32 15.6,20 Z" fill="url(#f3${id})"/>
      <ellipse cx="15.6" cy="45" rx="2" ry="3.2" fill="#3a6bd6" opacity=".35"/>
    </svg></div>`;
  el.innerHTML = html;
}

  [ {w:34, h:118, x:-(W/2+34), z:D*0.30, seed:3, fl:'1.3s', dl:'0s'},
    {w:31, h:82,  x:-(W/2+30), z:D*1.05, seed:7, fl:'1.1s', dl:'-.4s'},
    {w:37, h:52,  x:-(W/2+74), z:D*0.85, seed:11, fl:'1.5s', dl:'-.8s'} ].forEach((c, i) => {
    const el = document.createElement('div'); el.className = 'candle';
    el.style.setProperty('--cx', c.x+'px'); el.style.setProperty('--cz', c.z+'px');
    buildCandle3D(el, i, c.w*k/2, c.h*k, c.seed, c.fl, c.dl);
    fgWorld.appendChild(el);
  });
  const lid = $('#lid');
  lid.style.transformOrigin = `50% 0 ${-D/2}px`;
  const R = (D*D/4 + Hl*Hl) / (2*Hl), th = Math.asin((D/2)/R), N = 8, dphi = 2*th/N;
  const L = 2*R*Math.sin(dphi/2) + 1.2, cy = -H/2 + (R - Hl);
  const Lx = [-.35, -.8, .5]; const ln = Math.hypot(...Lx); const Ld = Lx.map(v => v/ln);
  for(let i=0;i<N;i++){
    const phi = -th + dphi*(i+.5);
    const y = cy - R*Math.cos(phi), z = R*Math.sin(phi);
    const rx = 90 - phi*180/Math.PI;
    const top = (H - L)/2;
    const pl = document.createElement('div'); pl.className = 'plank';
    pl.style.top = top+'px'; pl.style.height = L+'px';
    pl.style.transform = `translate3d(0,${y}px,${z}px) rotateX(${rx}deg)`;
    const n = [0, -Math.cos(phi), Math.sin(phi)];
    const b = .42 + .58*Math.max(0, n[0]*Ld[0] + n[1]*Ld[1] + n[2]*Ld[2]);
    pl.innerHTML = `<div class="iron l"></div><div class="iron r"></div><div class="band l"></div><div class="band r"></div><div class="dim" style="background:rgba(0,0,0,${(1-b).toFixed(2)})"></div>`;
    if(i === Math.floor(N/2)) pl.innerHTML += '<div class="engr" id="engr"></div>';
    lid.appendChild(pl);
    const pi = document.createElement('div'); pi.className = 'plank-in';
    pi.style.top = top+'px'; pi.style.height = L+'px';
    pi.style.transform = `translate3d(0,${y}px,${z}px) rotateX(${rx+180}deg)`;
    pi.innerHTML = `<div class="dim" style="background:rgba(0,0,0,${(.25 + .3*Math.abs(phi)/th).toFixed(2)})"></div>`;
    lid.appendChild(pi);
  }
  const clip = `circle(${R}px at 50% ${R}px)`;
  [[-1,'cap',-90,.15],[1,'cap',90,.55],[-1,'cap-in',90,.35],[1,'cap-in',-90,.25]].forEach(([sx, cls, ry, dark]) => {
    const c = document.createElement('div'); c.className = cls;
    c.style.width = D+'px'; c.style.height = Hl+'px';
    c.style.left = (W-D)/2+'px'; c.style.top = (H-Hl)/2+'px';
    const inset = cls === 'cap-in' ? -sx*2 : 0;
    c.style.transform = `translate3d(${sx*W/2 + inset}px,${-H/2 - Hl/2}px,0) rotateY(${ry}deg)`;
    c.style.clipPath = clip; c.style.webkitClipPath = clip;
    c.innerHTML = `<div class="dim" style="background:rgba(0,0,0,${dark})"></div>`;
    lid.appendChild(c);
  });
})();

$('#engr').textContent = CONFIG.gravur || '';

/* ---------- Zahlenschloss ---------- */
const ROW = 40, OFF = 11;
const mod = (a, n) => ((a % n) + n) % n;
const wheels = [...document.querySelectorAll('.wheel')];
const strips = wheels.map(w => w.querySelector('.strip'));
const v = [0, 0, 0, 0];
function setIdx(i, idx, anim){
  strips[i].style.transition = anim ? 'transform .26s cubic-bezier(.3,.7,.3,1.2)' : 'none';
  strips[i].style.transform = `translateY(${OFF - idx*ROW}px)`;
}
function hideHint(){ $('#whint').classList.remove('show'); }

wheels.forEach((w, i) => {
  strips[i].innerHTML = Array.from({length:30}, (_, k) => `<div class="d">${k % 10}</div>`).join('');
  setIdx(i, 10, false);
  let drag = false, y0 = 0, s0 = 0, moved = false, lastStep = 0;

  w.addEventListener('pointerdown', e => {
    if(state !== 'lock') return;
    e.preventDefault(); audio();
    drag = true; moved = false; y0 = e.clientY; s0 = v[i]; lastStep = Math.round(v[i]);
    try{ w.setPointerCapture(e.pointerId); }catch(_){}
    hideHint();
  });
  w.addEventListener('pointermove', e => {
    if(!drag) return;
    const dy = e.clientY - y0;
    if(Math.abs(dy) > 5) moved = true;
    v[i] = s0 - dy/ROW;
    const st = Math.round(v[i]);
    if(st !== lastStep){ lastStep = st; detent(); }
    setIdx(i, 10 + mod(v[i], 10), false);
  });
  const end = e => {
    if(!drag) return;
    drag = false;
    let target;
    if(!moved){
      const r = w.getBoundingClientRect();
      const step = (e.clientY < r.top + r.height/2) ? -1 : 1;
      target = 10 + mod(v[i], 10) + step;
      v[i] += step; detent();
    } else {
      target = Math.round(10 + mod(v[i], 10));
      v[i] = Math.round(v[i]);
    }
    setIdx(i, target, true);
    setTimeout(() => { setIdx(i, 10 + mod(v[i], 10), false); check(); }, 280);
  };
  w.addEventListener('pointerup', end);
  w.addEventListener('pointercancel', end);
});

function check(){
  if(state !== 'lock') return;
  const val = v.map(x => mod(Math.round(x), 10)).join('');
  if(val === CODE) unlock();
}

/* ---------- Truhe springt auf, Kamera fährt hoch ---------- */
function unlock(){
  state = 'opening';
  plate.classList.add('solved');
  latch();
  setTimeout(() => { $('#lid').classList.add('open'); chestWrap.classList.add('opened'); creak(1.35); lidThud(1.45); }, 800);
  setTimeout(() => {
    // Bewegung erst jetzt einschalten – vorher steht alles still
    const mv = 'transform 2.4s cubic-bezier(.55,0,.25,1)';
    [chestWrap, $('#roomWorld'), $('#fgWorld'), ...document.querySelectorAll('.bb')].forEach(el => el.style.transition = mv);
    requestAnimationFrame(() => scene.classList.add('camup'));
  }, 2100);
  setTimeout(liftScroll, 5600);
}

function liftScroll(){
  const mini = $('#mini');
  const r = mini.getBoundingClientRect();
  const sc = r.width / scroll.offsetWidth;
  const ease = 'cubic-bezier(.3,.8,.2,1)';
  scroll.style.transition = 'none';
  scroll.style.left = (r.left + r.width/2) + 'px';
  scroll.style.top = (r.top + r.height/2 - 20*sc) + 'px';
  scroll.style.transform = `translateX(-50%) scale(${sc})`;
  scroll.style.opacity = '1';
  mini.style.opacity = '0'; $('#minishadow').style.opacity = '0';
  scroll.offsetWidth;
  scroll.style.transition = `left 1.4s ${ease}, top 1.4s ${ease}, transform 1.4s ${ease}`;
  scroll.style.left = '50%';
  scroll.style.top = Math.round(innerHeight*0.12) + 'px';
  scroll.style.transform = 'translateX(-50%) scale(1)';
  veil.classList.add('on');
  paperSlide(1.2);
  setTimeout(() => { state = 'unroll'; scroll.classList.add('ready'); }, 1500);
}

/* ---------- Rolle nach unten aufziehen ---------- */
let h = 0, dragging = false, y0 = 0, h0 = 0, lastY = 0, lastT = 0;
addEventListener('pointerdown', e => {
  if(state !== 'unroll') return;
  dragging = true; y0 = e.clientY; h0 = h;
  paper.style.transition = 'none';
  scroll.classList.add('touched');
  lastY = e.clientY; lastT = performance.now();
  rustleStart();
});
addEventListener('pointermove', e => {
  if(!dragging) return;
  const max = inner.offsetHeight;
  h = Math.max(0, Math.min(max, h0 + (e.clientY - y0) * 1.15));
  paper.style.height = h + 'px';
  const now = performance.now();
  rustleMove(Math.abs(e.clientY - lastY) / Math.max(8, now - lastT));
  lastY = e.clientY; lastT = now;
});
function release(){
  if(!dragging) return;
  dragging = false;
  rustleStop();
  const max = inner.offsetHeight;
  paper.style.transition = 'height .75s cubic-bezier(.2,.8,.2,1)';
  if(h > max*0.35){
    h = max; paper.style.height = h + 'px';
    state = 'done';
    unfurl();
    setTimeout(done, 550);
  } else {
    h = 0; paper.style.height = '0px';
    scroll.classList.remove('touched');
  }
}
addEventListener('pointerup', release);
addEventListener('pointercancel', release);

/* ---------- Fertig ---------- */
function done(){
  const r = scroll.getBoundingClientRect();
  const colors = ['#ffe08a','#ffb43a','#fff3d0'];
  for(let i=0;i<30;i++){
    const s = document.createElement('span');
    s.className = 'spk';
    const c = colors[i % colors.length];
    s.style.background = c; s.style.boxShadow = `0 0 8px ${c}`;
    s.style.left = (r.left + Math.random()*r.width) + 'px';
    s.style.top  = (r.top + Math.random()*r.height) + 'px';
    s.style.setProperty('--dx', (Math.random()*70-35) + 'px');
    s.style.setProperty('--dy', (-40 - Math.random()*90) + 'px');
    s.style.animationDelay = (Math.random()*.7) + 's';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 2800);
  }
  setTimeout(() => $('#again').classList.add('show'), 2500);
}
$('#again').addEventListener('click', () => location.reload());
</script>
