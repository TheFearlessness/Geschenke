@supports (height:1dvh){:root{--ph:min(64dvh,500px)}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}
body{background:#bfe6f2;font-family:'Lora',Georgia,serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.scene{position:fixed;inset:0;overflow:hidden}

/* Himmel */
.sky{position:absolute;left:0;right:0;top:0;height:46%;background:linear-gradient(rgba(0,0,0,0) 70%,rgba(255,236,210,.45)),var(--sky) 0 0/auto 100% repeat-x;animation:skyd 240s linear infinite}
@keyframes skyd{to{background-position:0 0,-2000px 0}}
:root{--sky:var(--tx-sky)}
.sun{position:absolute;top:13%;right:16%;width:24vmin;height:24vmin;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,250,1) 0 14%,rgba(255,246,220,.75) 24%,rgba(255,232,180,.3) 42%,rgba(255,220,160,0) 70%);mix-blend-mode:screen;animation:sun 6s ease-in-out infinite}
@keyframes sun{50%{transform:scale(1.06)}}
.cloud{position:absolute;height:24px;width:110px;background:#fff;border-radius:20px;opacity:.85;animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:50px;height:46px;left:16px;top:-24px}
.cloud::after{width:40px;height:36px;left:50px;top:-15px}
.c1{top:9%;animation-duration:70s;animation-delay:-20s}
.c2{top:22%;transform:scale(.7);animation-duration:95s;animation-delay:-60s;opacity:.7}
@keyframes drift{from{transform:translateX(-150px)}to{transform:translateX(110vw)}}

/* Meer + Strand */
.sea{position:absolute;left:0;right:0;top:44%;bottom:0;background:linear-gradient(rgba(8,40,70,.35),rgba(10,60,90,0) 30%,rgba(140,220,215,.18) 75%),var(--tx-sea) center top/cover}
.gl{position:absolute;height:2px;border-radius:2px;background:#fff;opacity:0;animation:gl 4s ease-in-out infinite}
@keyframes gl{50%{opacity:.7}}
.sand{position:absolute;left:0;right:0;top:66%;bottom:0;
  background:radial-gradient(circle at 70% 40%,rgba(255,250,235,.22),transparent 45%),linear-gradient(rgba(110,80,40,.28),rgba(0,0,0,0) 30%,rgba(90,60,25,.18)),var(--tx-sand) center top/cover}
.wet{position:absolute;left:0;right:0;top:64%;height:16%;
  background:linear-gradient(rgba(160,120,70,.35),rgba(160,120,70,0));animation:wet 7s ease-in-out infinite}
@keyframes wet{0%,100%{opacity:.3}50%{opacity:1}}
.wave{position:absolute;left:-5%;width:110%;top:50%;height:16%;animation:wave 7s ease-in-out infinite}
.wave svg{width:100%;height:100%;display:block}
.wave.w2{top:48%;opacity:.65;animation-delay:-3.5s}
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(9vh)}}


/* Muscheln */
.shells{position:absolute;inset:0;pointer-events:none}
.shell{position:absolute;background:center/100% 100% no-repeat;transform-origin:50% 50%;
  filter:drop-shadow(2px 3px 2px rgba(90,60,25,.38))}
.shell.buried{filter:drop-shadow(1px 1px 1px rgba(90,60,25,.25))}
.s-scallop{background-image:var(--tx-shell_scallop)}
.s-scallop2{background-image:var(--tx-shell_scallop2)}
.s-auger{background-image:var(--tx-shell_auger)}
.s-clam{background-image:var(--tx-shell_clam)}
.s-cockle{background-image:var(--tx-shell_cockle)}

/* Flasche */
.bottle{position:absolute;width:300px;height:110px;left:48%;top:52%;opacity:0;z-index:5;cursor:pointer;
  transform:translate(-50%,-50%) rotate(-6deg) scale(.22)}
.bottle svg{width:300px;height:110px;display:block;overflow:visible}
.bottle .hit{position:absolute;inset:-70px}
.bwob{transform-origin:50% 60%}
.bottle.idle .bwob{animation:wob 2.6s ease-in-out infinite}
@keyframes wob{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-4deg)}80%{transform:rotate(3deg)}90%{transform:rotate(-1.5deg)}}
.bottle .ring{position:absolute;left:50%;top:50%;width:260px;height:260px;margin:-130px 0 0 -130px;border-radius:50%;
  border:5px solid rgba(255,255,255,.9);opacity:0;pointer-events:none}
.bottle.idle .ring{animation:ring 2.6s ease-out infinite}
@keyframes ring{0%{transform:scale(.45);opacity:0}15%{opacity:.8}100%{transform:scale(1.1);opacity:0}}
.sheen{transform:translateX(-80px)}
.bottle.idle .sheen,.bottle.cork-hint .sheen{animation:sheen 3.2s ease-in-out infinite}
@keyframes sheen{0%,55%{transform:translateX(-80px)}100%{transform:translateX(380px)}}
.shadow{transition:opacity .5s}
.bottle.focused .shadow{opacity:0}
#cork{transform-box:fill-box;transform-origin:center;transition:transform 1.1s cubic-bezier(.2,.7,.3,1),opacity 1s ease-in}
.bottle.cork-hint #cork{animation:corkp 1.4s ease-in-out infinite;filter:drop-shadow(0 0 6px rgba(255,255,255,.95))}
@keyframes corkp{0%,100%{transform:translateX(0) scale(1)}50%{transform:translateX(5px) scale(1.08)}}
@keyframes twist{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(2px) rotate(4deg)}75%{transform:translateX(3px) rotate(-4deg)}}
#cork.twist{animation:twist .09s linear infinite}
#cork.fly{transform:translate(300px,70px) rotate(720deg);opacity:0}
#innerScroll{transform-box:fill-box;transition:transform .9s cubic-bezier(.5,0,.7,1),opacity .25s linear .55s}
#innerScroll.slide{transform:translateX(230px);opacity:0}

.veil{position:fixed;inset:0;z-index:4;background:rgba(10,35,50,0);transition:background .9s,backdrop-filter .9s;pointer-events:none}
.veil.on{background:rgba(10,35,50,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}

/* Schriftrolle */
.scroll{position:fixed;left:50%;top:12vh;width:var(--sw);transform:translateX(-50%);transform-origin:50% 0;opacity:0;z-index:30;pointer-events:none}
.roller{position:relative;height:36px;margin:0 -14px;z-index:2;background:var(--tx-roll) center/100% 100% no-repeat;filter:drop-shadow(0 5px 6px rgba(0,0,0,.45))}
.paper{position:relative;height:0;overflow:hidden;margin:-14px 0;z-index:1;background:var(--tx-sheet) 50% 0/100% auto no-repeat;filter:drop-shadow(0 3px 5px rgba(0,0,0,.35))}
.paper-inner{height:var(--ph);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
  padding:22px 34px;text-align:center;color:#4a3216;font-family:'Dancing Script',cursive}
.k{font-size:22px;font-weight:700;color:rgba(80,48,16,.8)}
.t{font-family:'Dancing Script',cursive;font-weight:700;font-size:clamp(28px,8vw,38px);line-height:1.05;color:#7a3a14;text-wrap:balance}
.x{font-size:17.5px;line-height:1.4;max-width:30ch}
.orn{width:60%;height:1px;background:linear-gradient(90deg,transparent,#8a6a3a,transparent)}
.g{font-family:'Dancing Script',cursive;font-size:23px;color:#6a3412}
.v{font-size:16px;color:rgba(60,38,14,.8)}
.pull{position:absolute;left:50%;top:30px;width:34px;transform:translateX(-50%);opacity:0;transition:opacity .4s;pointer-events:none}
.scroll.ready .pull{opacity:1}
.scroll.touched .pull{opacity:0}
.pull svg{display:block;width:34px;height:34px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.6));animation:pull 1.7s ease-in infinite}
@keyframes pull{0%{transform:translateY(0);opacity:0}25%{opacity:.85}100%{transform:translateY(40px);opacity:0}}

.spk{position:fixed;width:6px;height:6px;border-radius:50%;z-index:40;pointer-events:none;opacity:0;animation:spk 1.9s ease-out forwards}
@keyframes spk{0%{opacity:0;transform:translate(0,0) scale(.4)}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1)}}
.again{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:42px;height:42px;border-radius:50%;border:0;
  background:rgba(255,255,255,.18);color:#fff;font-size:20px;z-index:50;opacity:0;pointer-events:none;transition:opacity 1s}
.again.show{opacity:1;pointer-events:auto}
</style>
</head>

<script>
/* =========================================================
   HIER KANNST DU DEN TEXT ANPASSEN
   ========================================================= */
const CONFIG = {
  kicker: "Gutschein",
  titel:  "für eine Reise zu zweit",
  text:   "An die Finderin dieser Flasche: Hiermit wird dir eine gemeinsame Reise versprochen. Ziel, Zeitpunkt und Sonnenbrille darfst du selbst wählen. Einlösbar bei dem, der dich liebt.",
  gruss:  "Alles Liebe zum Geburtstag, mein Schatz!",
  von:    ""
};
/* ========================================================= */

const $ = s => document.querySelector(s);
$('#tK').textContent = CONFIG.kicker;
$('#tT').textContent = CONFIG.titel;
$('#tX').textContent = CONFIG.text;
$('#tG').textContent = CONFIG.gruss;
$('#tV').textContent = CONFIG.von;
if(!CONFIG.von) $('#tV').style.display = 'none';

const bottle = $('#bottle'), veil = $('#veil'), scroll = $('#scroll');
const paper = $('#paper'), inner = $('#paperInner');
let state = 'arrive';

/* ---------- Klänge: alles live im Browser erzeugt (startet mit der ersten Berührung) ---------- */
let ac = null, out = null, wet = null;
const bufCache = {};
function audio(){
  if(!ac){
    try{
      ac = new (window.AudioContext || window.webkitAudioContext)();
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -16; comp.ratio.value = 3; comp.attack.value = .004; comp.release.value = .2;
      comp.connect(ac.destination);
      out = ac.createGain(); out.gain.value = .9; out.connect(comp);
      const conv = ac.createConvolver(); conv.buffer = impulse(REVERB.time, REVERB.decay);
      wet = ac.createGain(); wet.gain.value = REVERB.mix; wet.connect(conv); conv.connect(comp);
    }catch(e){ ac = null; }
  }
  if(ac && ac.state === 'suspended') ac.resume();
  return ac;
}
function impulse(sec, decay){
  const n = Math.floor(ac.sampleRate*sec), b = ac.createBuffer(2, n, ac.sampleRate);
  for(let c=0;c<2;c++){ const d = b.getChannelData(c); for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/n, decay); }
  return b;
}
function noiseBuf(kind){
  if(bufCache[kind]) return bufCache[kind];
  const n = ac.sampleRate*4, b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
  let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0,last=0;
  for(let i=0;i<n;i++){
    const w = Math.random()*2-1;
    if(kind === 'white') d[i] = w;
    else if(kind === 'pink'){
      b0=.99886*b0+w*.0555179; b1=.99332*b1+w*.0750759; b2=.969*b2+w*.153852;
      b3=.8665*b3+w*.3104856; b4=.55*b4+w*.5329522; b5=-.7616*b5-w*.016898;
      d[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11; b6=w*.115926;
    } else { last = (last + .02*w)/1.02; d[i] = last*3.5; }
  }
  return bufCache[kind] = b;
}
function send(node, amount){
  if(!amount) return;
  const s = ac.createGain(); s.gain.value = amount; node.connect(s); s.connect(wet);
}
/* gefiltertes Rauschen als kurzer Impuls */
function burst(o){
  const a = audio(); if(!a) return;
  const {kind='white', dur=.05, f=1000, q=1, type='bandpass', gain=.5, at=0, attack=.002, rev=.2} = o;
  const t = a.currentTime + at;
  const s = a.createBufferSource(); s.buffer = noiseBuf(kind);
  const fl = a.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
  const g = a.createGain();
  g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(gain, t+attack);
  g.gain.exponentialRampToValueAtTime(.0001, t+attack+dur);
  s.connect(fl); fl.connect(g); g.connect(out); send(g, rev);
  s.start(t, Math.random()*3); s.stop(t+attack+dur+.05);
}
/* abklingender Teilton (für Glas, Metall, Holzkörper) */
function partial(freq, dur, gain, at=0, rev=.3){
  const a = audio(); if(!a) return;
  const t = a.currentTime + at;
  const o = a.createOscillator(); o.frequency.value = freq * (1 + (Math.random()-.5)*.006);
  const g = a.createGain();
  g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(gain, t+.002);
  g.gain.exponentialRampToValueAtTime(.0001, t+dur);
  o.connect(g); g.connect(out); send(g, rev);
  o.start(t); o.stop(t+dur+.05);
}

/* ---- Papier / Pergament ---- */
function crinkle(at, v){
  burst({dur:.003+Math.random()*.012, f:1400+Math.random()*5500, q:1.2+Math.random()*4,
         gain:.2*v, at, attack:.0005, rev:.12});
}
function paperSlide(dur=.9, at=0){
  burst({kind:'pink', dur, f:2300, q:.6, gain:.13, at, attack:dur*.45, rev:.15});
  for(let i=0;i<12;i++) crinkle(at + Math.random()*dur, .35 + Math.random()*.3);
}
let rsSrc = null, rsGain = null, rsBP = null;
function rustleStart(){
  const a = audio(); if(!a) return;
  rsSrc = a.createBufferSource(); rsSrc.buffer = noiseBuf('white'); rsSrc.loop = true;
  const hp = a.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 900;
  rsBP = a.createBiquadFilter(); rsBP.type = 'bandpass'; rsBP.frequency.value = 2600; rsBP.Q.value = .7;
  rsGain = a.createGain(); rsGain.gain.value = 0;
  rsSrc.connect(hp); hp.connect(rsBP); rsBP.connect(rsGain); rsGain.connect(out); send(rsGain, .12);
  rsSrc.start(0, Math.random()*3);
}
function rustleMove(speed){            // speed in px/ms
  if(!rsGain) return;
  const t = ac.currentTime;
  rsGain.gain.setTargetAtTime(Math.min(.2, speed*.16), t, .04);
  rsBP.frequency.setTargetAtTime(1900 + Math.random()*2600, t, .05);
  if(Math.random() < Math.min(1, speed*1.4)){
    const n = Math.min(4, 1 + Math.floor(speed*2));
    for(let i=0;i<n;i++) crinkle(Math.random()*.03, .5 + Math.random()*.5);
  }
}
function rustleStop(){
  if(!rsGain) return;
  rsGain.gain.setTargetAtTime(0, ac.currentTime, .06);
  const s = rsSrc; setTimeout(() => { try{ s.stop(); }catch(e){} }, 600);
  rsGain = null;
}
function unfurl(){                     // Rolle springt ganz auf + "Flapp"
  for(let i=0;i<18;i++) crinkle(i*.022 + Math.random()*.02, 1 - i/22);
  burst({kind:'pink', dur:.14, f:850, q:.6, gain:.38, at:.42, attack:.004, rev:.25});
  burst({dur:.05, f:2600, q:.9, gain:.22, at:.42, attack:.002, rev:.2});
  partial(105, .09, .14, .42, .1);
}

const REVERB = {time: .6, decay: 4, mix: .12};   // draußen: kaum Hall

/* ---- Meeresrauschen, im Takt der Wellen (7 s) ---- */
let oceanOn = false;
function startOcean(){
  const a = audio(); if(!a || oceanOn) return; oceanOn = true;
  const layer = (kind, type, f, q) => {
    const s = a.createBufferSource(); s.buffer = noiseBuf(kind); s.loop = true;
    const fl = a.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
    const g = a.createGain(); g.gain.value = 0;
    s.connect(fl); fl.connect(g); s.start(0, Math.random()*3);
    return {fl, g};
  };
  const body = layer('pink', 'lowpass', 600, .5);      // anrollende Welle
  const rumble = layer('brown', 'lowpass', 200, .5);   // tiefes Grundrauschen
  const foam = layer('white', 'bandpass', 4200, .5);   // Gischt / zurückfließendes Wasser
  const bus = a.createGain();
  bus.gain.setValueAtTime(0, a.currentTime); bus.gain.linearRampToValueAtTime(.45, a.currentTime + 3);
  [body, rumble, foam].forEach(l => l.g.connect(bus));
  bus.connect(out); send(bus, .15);
  rumble.g.gain.value = .45;
  const P = 7, N = 256;
  const bump = (p, c, w) => { let d = Math.abs(p-c); d = Math.min(d, 1-d); return Math.exp(-((d/w)**2)); };
  const curve = f => { const c = new Float32Array(N); for(let i=0;i<N;i++) c[i] = f(i/(N-1)); return c; };
  const cBody = curve(p => .25 + .8*bump(p,.44,.13) + .35*bump(p,.95,.08));
  const cLp   = curve(p => 420 + 1900*bump(p,.46,.1) + 500*bump(p,.96,.07));
  const cFoam = curve(p => .04 + .5*bump(p,.5,.05) + .3*bump(p,.63,.12) + .14*bump(p,.98,.05));
  const nowMs = (document.timeline && document.timeline.currentTime) || performance.now();
  const phase = (nowMs/1000 % P) / P;
  let next = a.currentTime + (1 - phase)*P;
  body.g.gain.setValueAtTime(.3, a.currentTime); foam.g.gain.setValueAtTime(.05, a.currentTime);
  const sched = () => {
    while(next < a.currentTime + P*1.5){
      body.g.gain.setValueCurveAtTime(cBody, next, P - .02);
      body.fl.frequency.setValueCurveAtTime(cLp, next, P - .02);
      foam.g.gain.setValueCurveAtTime(cFoam, next, P - .02);
      next += P;
    }
  };
  sched(); setInterval(sched, 2000);
}
['pointerdown','pointerup','touchend','click'].forEach(ev =>
  addEventListener(ev, () => { if(audio()) startOcean(); }, {passive:true}));

/* ---- Glasflasche ---- */
function glassTap(at=0, v=1, pitch=1){
  const f0 = (1650 + Math.random()*250) * pitch;
  [1, 1.47, 2.23, 3.17, 4.38].forEach((m, i) =>
    partial(f0*m, .9/(1+i*.8), .2*v/(1+i*.5), at, .45));
  burst({dur:.006, f:5000, type:'highpass', q:.7, gain:.4*v, at, attack:.0006, rev:.2});
}
function slosh(at=0, dur=1.2){            // etwas Restwasser in der Flasche
  const a = audio(); if(!a) return;
  const t = a.currentTime + at;
  const s = a.createBufferSource(); s.buffer = noiseBuf('brown'); s.loop = true;
  const bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 520; bp.Q.value = 1.4;
  const g = a.createGain(); g.gain.setValueAtTime(0, t);
  for(let k=0;k<6;k++){
    const tk = t + k*dur/6 + Math.random()*.05, v = .5*(1 - k/7)*(.6 + Math.random()*.4);
    g.gain.setTargetAtTime(v, tk, .03); g.gain.setTargetAtTime(.02, tk + .08, .05);
    bp.frequency.setTargetAtTime(380 + Math.random()*400, tk, .04);
  }
  s.connect(bp); bp.connect(g); g.connect(out); send(g, .2);
  s.start(t, Math.random()*3); s.stop(t + dur + .5);
}
function pickup(){
  burst({kind:'pink', dur:.28, f:1300, q:.6, gain:.22, attack:.04, rev:.1});   // Sand rieselt ab
  glassTap(.02, 1, 1);
  glassTap(.11, .45, 1.06);
  slosh(.25, 1.1);
}

/* ---- Korken: erst Quietschen, dann Plopp ---- */
function corkPop(){
  let t = 0;
  for(let i=0;i<14;i++){
    t += .022 - i*.0011;
    burst({dur:.012, f:1800 + Math.random()*1400, q:6, gain:.06 + i*.007, at:t, attack:.001, rev:.1});
  }
  const at = t + .02;
  burst({dur:.012, f:1200, q:.8, gain:.9, at, attack:.0008, rev:.25});           // Knall
  burst({kind:'pink', dur:.06, f:420, q:2.5, gain:.7, at, attack:.001, rev:.3});  // Flaschenhals
  partial(185, .09, .35, at, .2);
  burst({dur:.18, f:3500, type:'highpass', q:.5, gain:.06, at:at+.01, attack:.01, rev:.1}); // Luft
  glassTap(at + .03, .25, .9);
  return at;
}

/* ---------- Muscheln zufällig verteilen ---------- */
(function placeShells(){
  const box = $('#shells');
  const types = [
    ['s-scallop', 240, 240, 1.0], ['s-scallop2', 240, 240, .9], ['s-auger', 110, 300, .9],
    ['s-clam', 230, 200, .8], ['s-cockle', 210, 200, .75]
  ];
  const placed = [];
  const count = 7 + Math.floor(Math.random()*3);
  let tries = 0;
  while(placed.length < count && tries++ < 400){
    const x = 6 + Math.random()*88;           // % von links
    const y = 71 + Math.random()*25;          // % von oben (Sandfläche)
    if(Math.abs(x-57) < 15 && Math.abs(y-79) < 7) continue;   // Liegeplatz der Flasche frei lassen
    if(placed.some(p => Math.hypot((p.x-x)*innerWidth/100, (p.y-y)*innerHeight/100) < 46)) continue;
    placed.push({x, y});
    const [cls, w, h, k] = types[Math.floor(Math.random()*types.length)];
    const depth = (y - 66) / 30;               // weiter vorne = größer
    const size = (20 + depth*38) * k * Math.min(1.4, innerWidth/390);
    const el = document.createElement('div');
    el.className = 'shell ' + cls;
    el.style.width  = (size * w/Math.max(w,h)) + 'px';
    el.style.height = (size * h/Math.max(w,h)) + 'px';
    el.style.left = x + '%'; el.style.top = y + '%';
    const rot = cls === 's-auger' ? (Math.random() < .5 ? 1 : -1) * (55 + Math.random()*60) : Math.random()*360;
    el.style.transform = `translate(-50%,-50%) scaleY(.68) rotate(${rot}deg)`;
    if(Math.random() < .45){
      el.classList.add('buried');
      const ang = Math.random()*Math.PI*2, off = 22 + Math.random()*18;
      const cx = 50 + Math.cos(ang)*off, cy = 50 + Math.sin(ang)*off;
      const m = `radial-gradient(ellipse 85% 80% at ${cx}% ${cy}%, #000 30%, rgba(0,0,0,.55) 48%, rgba(0,0,0,.15) 62%, transparent 72%)`;
      el.style.webkitMaskImage = m; el.style.maskImage = m;
    }
    box.appendChild(el);
  }
})();

/* ---------- 1. Flasche wird angespült ---------- */
const REST = 'translate(-50%,-50%) rotate(-18deg) scale(.42)';
function arrive(){
  const a = bottle.animate([
    {left:'46%', top:'52%', opacity:0, transform:'translate(-50%,-50%) rotate(-4deg) scale(.2)'},
    {left:'49%', top:'58%', opacity:1, transform:'translate(-50%,-50%) rotate(9deg) scale(.27)', offset:.3},
    {left:'53%', top:'67%', opacity:1, transform:'translate(-50%,-50%) rotate(-12deg) scale(.36)', offset:.65},
    {left:'56%', top:'76%', opacity:1, transform:'translate(-50%,-50%) rotate(-15deg) scale(.41)', offset:.85},
    {left:'57%', top:'79%', opacity:1, transform:REST}
  ], {duration:4800, easing:'cubic-bezier(.3,.6,.3,1)', fill:'forwards'});
  a.onfinish = () => {
    Object.assign(bottle.style, {left:'57%', top:'79%', opacity:'1', transform:REST});
    a.cancel();
    state = 'idle';
    bottle.classList.add('idle');
  };
}
setTimeout(arrive, 1400);

/* ---------- 2. Flasche antippen -> in den Fokus ---------- */
bottle.addEventListener('pointerup', () => {
  if(state !== 'idle') return;
  state = 'focus'; audio(); pickup();
  bottle.classList.remove('idle');
  bottle.classList.add('focused');
  veil.classList.add('on');
  const s = Math.min(1.6, (innerHeight*0.6)/300, (innerWidth*0.85)/110);
  const ease = 'cubic-bezier(.3,.8,.2,1)';
  bottle.style.transition = `left 1.3s ${ease}, top 1.3s ${ease}, transform 1.3s ${ease}`;
  bottle.style.left = '50%';
  bottle.style.top = '52%';
  bottle.style.transform = `translate(-50%,-50%) rotate(-90deg) scale(${s})`;
  setTimeout(() => { state = 'cork'; bottle.classList.add('cork-hint'); }, 1350);
});

/* ---------- 3. Korken antippen -> Plopp, Rolle kommt raus ---------- */
addEventListener('pointerup', e => {
  if(state !== 'cork') return;
  const c = $('#cork').getBoundingClientRect(), pad = 45;
  if(e.clientX < c.left - pad || e.clientX > c.right + pad || e.clientY < c.top - pad || e.clientY > c.bottom + pad) return;
  state = 'out';
  bottle.classList.remove('cork-hint');
  const popAt = corkPop() * 1000;
  $('#cork').classList.add('twist');
  setTimeout(() => { $('#cork').classList.remove('twist'); $('#cork').classList.add('fly'); }, popAt);

  setTimeout(() => {
    paperSlide(1.0, .1);
    const r = $('#bsvg').getBoundingClientRect();
    $('#innerScroll').classList.add('slide');
    const ease = 'cubic-bezier(.3,.8,.2,1)';
    scroll.style.transition = 'none';
    const sc2 = Math.max(.15, (r.height*0.47)/scroll.offsetWidth);
    scroll.style.left = (r.left + r.width/2) + 'px';
    scroll.style.top = (r.top - r.height*0.2) + 'px';
    scroll.style.transformOrigin = '50% 18px';
    scroll.style.transform = `translateX(-50%) rotate(90deg) scale(${sc2})`;
    scroll.style.opacity = '0';
    scroll.offsetWidth;
    scroll.style.transition = `opacity .2s linear .6s, left 1.3s ${ease} .75s, top 1.3s ${ease} .75s, transform 1.3s ${ease} .75s`;
    scroll.style.opacity = '1';
    scroll.style.left = '50%';
    scroll.style.top = Math.round(innerHeight*0.12) + 'px';
    scroll.style.transform = 'translateX(-50%) rotate(0deg) scale(1)';
    setTimeout(() => {
      bottle.style.transition = 'top 1.1s ease-in, opacity .9s ease-in';
      bottle.style.top = '118%';
      bottle.style.opacity = '0';
    }, 900);
    setTimeout(() => { state = 'unroll'; scroll.classList.add('ready'); }, 2200);
  }, popAt + 350);
});

/* ---------- 4. Rolle nach unten aufziehen ---------- */
let h = 0, dragging = false, y0 = 0, h0 = 0, lastY = 0, lastT = 0;
addEventListener('pointerdown', e => {
  if(state !== 'unroll') return;
  dragging = true; y0 = e.clientY; h0 = h;
  paper.style.transition = 'none';
  scroll.classList.add('touched');
  lastY = e.clientY; lastT = performance.now();
  rustleStart();
});
addEventListener('pointermove', e => {
  if(!dragging) return;
  const max = inner.offsetHeight;
  h = Math.max(0, Math.min(max, h0 + (e.clientY - y0) * 1.15));
  paper.style.height = h + 'px';
  const now = performance.now();
  rustleMove(Math.abs(e.clientY - lastY) / Math.max(8, now - lastT));
  lastY = e.clientY; lastT = now;
});
function release(){
  if(!dragging) return;
  dragging = false;
  rustleStop();
  const max = inner.offsetHeight;
  paper.style.transition = 'height .75s cubic-bezier(.2,.8,.2,1)';
  if(h > max*0.35){
    h = max; paper.style.height = h + 'px';
    state = 'done';
    unfurl();
    setTimeout(done, 550);
  } else {
    h = 0; paper.style.height = '0px';
    scroll.classList.remove('touched');
  }
}
addEventListener('pointerup', release);
addEventListener('pointercancel', release);

/* ---------- 5. Fertig ---------- */
function done(){
  const r = scroll.getBoundingClientRect();
  const colors = ['#fff','#ffe9a8','#bff3f0','#ffd1a1'];
  for(let i=0;i<30;i++){
    const s = document.createElement('span');
    s.className = 'spk';
    const c = colors[i % colors.length];
    s.style.background = c; s.style.boxShadow = `0 0 8px ${c}`;
    s.style.left = (r.left + Math.random()*r.width) + 'px';
    s.style.top  = (r.top + Math.random()*r.height) + 'px';
    s.style.setProperty('--dx', (Math.random()*70-35) + 'px');
    s.style.setProperty('--dy', (-40 - Math.random()*90) + 'px');
    s.style.animationDelay = (Math.random()*.7) + 's';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 2800);
  }
  setTimeout(() => $('#again').classList.add('show'), 2500);
}
$('#again').addEventListener('click', () => location.reload());
</script>
